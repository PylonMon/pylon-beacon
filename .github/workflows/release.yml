name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: build all platforms
        run: |
          mkdir -p dist
          V="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$V" -o dist/pylon-beacon-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$V" -o dist/pylon-beacon-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$V" -o dist/pylon-beacon-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$V" -o dist/pylon-beacon-darwin-arm64 .
      - name: VERSION and SHA256SUMS (what auto-update reads and verifies against)
        run: |
          cd dist
          echo "${GITHUB_REF_NAME#v}" > VERSION
          sha256sum pylon-beacon-* > SHA256SUMS
          cat VERSION SHA256SUMS
      - name: the binary must report the tag it was built from
        run: |
          want="pylon-beacon ${GITHUB_REF_NAME#v}"
          got="$(./dist/pylon-beacon-linux-amd64 -version)"
          echo "reports: $got"
          test "$got" = "$want" || { echo "expected: $want" >&2; exit 1; }
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
